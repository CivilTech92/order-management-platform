services:
 postgres:
    image: postgres:16
    container_name: order-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
 redis:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "6380:6379"     

volumes:
  postgres_data: